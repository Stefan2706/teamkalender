name: Idee / Feature request
description: Vorschlag für eine neue Funktion / Suggest a new feature
labels: ["enhancement"]
body:
  - type: textarea
    id: idee
    attributes:
      label: Was wünschen Sie sich? / What would you like?
    validations:
      required: true
  - type: textarea
    id: warum
    attributes:
      label: Wofür brauchen Sie das? / Why do you need it?
      description: Z. B. „In Outlook konnten wir …“
